services:
  # Node.js Express API Backend
  #
  # The ML service (ML/) is intentionally NOT deployed. Its source is kept in
  # the repository but it is dormant; see ML/README.md.
  - type: web
    name: cine-mark-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRISMA_CLIENT_ENGINE_TYPE
        value: library
      # Set these in the Render dashboard; they are never committed.
      # DATABASE_URL must be the pooled Neon endpoint (hostname contains
      # "-pooler") with sslmode=require&pgbouncer=true.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL must be the unpooled Neon endpoint with sslmode=require.
      # Required even at build time, because `prisma generate` reads it.
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
